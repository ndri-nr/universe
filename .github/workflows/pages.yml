# Deploy the site to GitHub Pages.
#
# This repo used to rely on Pages' legacy branch build, which runs Jekyll over
# the whole tree even though nothing here needs it — and that builder started
# failing (the nebula commit onward never reached the live site). There is no
# build step: the site is static HTML/CSS/ES modules, so this workflow just
# uploads the repo as-is and deploys it.
#
# One manual step is still required if it hasn't been done: in the repo's
# Settings -> Pages, set "Build and deployment -> Source" to "GitHub Actions".
# Adding this file alone does not switch a repo off the legacy builder.
#
# Observed failure this is tuned against: the deploy step sat in
# `deployment_queued` and aborted at actions/deploy-pages' 10-minute default
# ("Timeout reached, aborting!"). The Jekyll build itself was fine — it is the
# deployment that never leaves the queue. Note the legacy source's built-in
# workflow uses this same action, so a queue stall is NOT fixed by switching
# source; if it recurs, the cause is upstream of this file. In order of
# likelihood: a protection rule on the `github-pages` environment (a required
# reviewer or wait timer leaves deployments queued until they expire), an
# earlier deployment stuck in progress holding the pipeline, or a GitHub
# incident. Check Settings -> Environments -> github-pages first.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress is true here, against the usual advice for Pages. The
# standard reason to keep it false is to let a real production deploy finish —
# but the failure being fixed is a run wedged in the queue, and a wedged run
# with cancel-in-progress: false blocks every later attempt behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # a queued deploy that is going to hang should give up in half an hour, not
    # sit on a runner for the 6-hour job default
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 25 min instead of the 10 min default. Does not fix a permanently
          # stuck queue, but Pages queues can genuinely run long, and the
          # previous failures aborted at exactly the default.
          timeout: 1500000
          error_count: 20
