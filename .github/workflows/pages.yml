# Deploy the site to GitHub Pages.
#
# This repo used to rely on Pages' legacy branch build, which runs Jekyll over
# the whole tree even though nothing here needs it — and that builder started
# failing (the nebula commit onward never reached the live site). There is no
# build step: the site is static HTML/CSS/ES modules, so this workflow just
# uploads the repo as-is and deploys it.
#
# Settings -> Pages -> "Build and deployment -> Source" is set to "GitHub
# Actions". That is a repo setting, not something this file can assert: if it
# ever gets flipped back to "Deploy from a branch", GitHub resumes generating its
# own `pages-build-deployment` workflow and the two deployers race, which is the
# failure this whole file exists to end.
#
# The failure, for the record: build and artifact upload always succeeded, then
# the deploy step polled `deployment_queued` until it gave up ("Timeout reached,
# aborting!" / "Deployment failed, try again later"). Nothing to do with the
# site's contents or file layout — the artifact existed by then. deploy-pages
# polls the deployment IT created, and Pages promotes one deployment at a time,
# so the deployer that lost the race waited on something that would never be
# promoted. The site would go live from the winner while the loser's run sat
# spinning. Raising the timeout does not help that; only removing the second
# deployer does.
#
# If a queue stall somehow recurs with a single deployer, the cause is upstream
# of this file: check Settings -> Environments -> github-pages for a protection
# rule (a required reviewer or wait timer leaves deployments queued until they
# expire), then githubstatus.com.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue later pushes behind an in-flight deploy rather than cancelling it. This
# was briefly true, to stop a run wedged by the two-deployer race from blocking
# everything behind it; with a single deployer there is nothing to wedge it, and
# killing a real production deploy midway is the worse trade.
#
# What counts as "deployed" here is the health check at the end of the job, not
# actions/deploy-pages' verdict. See the comment on that step: the Pages API's
# own deployment record has repeatedly sat at deployment_queued /
# deployment_in_progress and never reached `succeed`, while the site itself was
# serving the new content fine. A green run should mean the site is live, so that
# is what the job actually tests.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # must exceed both deploy attempts below (15 min each), or the job is killed
    # before the action gets to report anything useful
    # 8 min for deploy-pages, then up to 10 for the health check
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # current majors as of this commit. The last deployment of this repo that
      # actually succeeded ran deploy-pages@v5, so do not pin these back to v4/v3
      # without a reason — v4 was a major behind and is the one that kept aborting.
      - uses: actions/configure-pages@v6

      # Stamp the commit into the artifact so the deploy can be verified against
      # the live site rather than against Pages' own bookkeeping. Not committed to
      # the repo — it only exists inside the uploaded artifact.
      - run: echo "${GITHUB_SHA}" > _commit.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # continue-on-error because this step's verdict is not the one that matters;
      # the health check below is. deploy-pages waits for the Pages API to report
      # `succeed` and treats anything else as unfinished, and this repo has
      # repeatedly seen a deployment sit at `deployment_queued` or
      # `deployment_in_progress` until the action gives up while the site was
      # already serving the new content perfectly well. 8 min is enough to catch
      # a genuinely fast deploy; past that the health check decides.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 480000
          error_count: 20
          reporting_interval: 15000

      # The actual success condition: the live site serves THIS commit. That is
      # what "deployed" means for a static site, and unlike the deployment record
      # it cannot sit in a state that never resolves.
      - name: Verify the live site serves this commit
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          url="${url:-https://ndri-nr.github.io/universe/}"
          echo "checking ${url}_commit.txt for ${GITHUB_SHA}"
          for i in $(seq 1 40); do
            got=$(curl -fsS --max-time 20 "${url}_commit.txt" 2>/dev/null | tr -d "[:space:]" || true)
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "live after ~$((i*15))s"
              exit 0
            fi
            sleep 15
          done
          echo "::error::site never served ${GITHUB_SHA} (last saw \"${got:-nothing}\")"
          exit 1
