# Deploy the site to GitHub Pages.
#
# This repo used to rely on Pages' legacy branch build, which runs Jekyll over
# the whole tree even though nothing here needs it — and that builder started
# failing (the nebula commit onward never reached the live site). There is no
# build step: the site is static HTML/CSS/ES modules, so this workflow just
# uploads the repo as-is and deploys it.
#
# One manual step is still required if it hasn't been done: in the repo's
# Settings -> Pages, set "Build and deployment -> Source" to "GitHub Actions".
# Adding this file alone does not switch a repo off the legacy builder.
#
# Observed failure this is tuned against: the build and artifact upload both
# succeed, then the deploy step polls `deployment_queued` until
# actions/deploy-pages aborts at its 10-minute default ("Timeout reached,
# aborting!"). Nothing about the site's contents or file layout is involved —
# the artifact exists by then. The run that last succeeded showed the same
# queueing and simply outlasted it, which is why the timeouts here are generous.
#
# Note the legacy source's built-in workflow calls this same action, so a queue
# stall is not something switching source fixes by itself. If it still recurs
# after this, the cause is upstream of this file: check Settings -> Environments
# -> github-pages for a protection rule (a required reviewer or wait timer
# leaves deployments queued until they expire), look for an earlier deployment
# stuck in progress holding the pipeline, then githubstatus.com.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress is true here, against the usual advice for Pages. The
# standard reason to keep it false is to let a real production deploy finish —
# but the failure being fixed is a run wedged in the queue, and a wedged run
# with cancel-in-progress: false blocks every later attempt behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # must exceed the deploy-pages timeout below, or the job is killed before the
    # action gets to report anything useful
    timeout-minutes: 55
    environment:
      name: github-pages
      # fall through to the retry's output, or the URL is blank whenever the
      # first attempt was the one that lost the race
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # current majors as of this commit. The last deployment of this repo that
      # actually succeeded ran deploy-pages@v5, so do not pin these back to v4/v3
      # without a reason — v4 was a major behind and is the one that kept aborting.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # 45 min against a 10 min default. The run that succeeded also polled
          # `deployment_queued` repeatedly, so a slow queue is normal here rather
          # than a fault — every failure aborted at exactly the default, which
          # means the wait was too short, not that the deploy was dead.
          timeout: 2700000
          error_count: 20
          # poll every 15s rather than 5s: at a 45 min ceiling the default fills
          # the log with hundreds of identical status lines
          reporting_interval: 15000

      # One retry. Actions has no native step retry, hence continue-on-error on
      # the attempt above plus this conditional second go. The artifact is still
      # attached to this run, so it does not need re-uploading. Worth having
      # because the observed error is literally "Deployment failed, try again
      # later" — a queued deployment that lost a race, not a broken build.
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 2700000
          error_count: 20
          reporting_interval: 15000
